name: Password reset security regression
on:
  push:
    branches: [claude/auth-reset-page]
    paths:
      - 'auth/reset/**'
      - 'tests/auth-reset-security.test.mjs'
      - '.github/workflows/reset-security.yml'
  pull_request:
    paths:
      - 'auth/reset/**'
      - 'tests/auth-reset-security.test.mjs'
      - '.github/workflows/reset-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify auth reset web config and code privacy
        run: node --test tests/auth-reset-security.test.mjs
