name: Pretio public catalog browser

on:
  pull_request:
    paths:
      - 'pretio/catalog/**'
      - 'pretio/promos/**'
      - 'pretio/index.html'
      - 'tests/pretio-catalog-smoke.test.mjs'
      - '.github/workflows/pretio-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'pretio/catalog/**'
      - 'pretio/promos/**'
      - 'pretio/index.html'
      - 'tests/pretio-catalog-smoke.test.mjs'
      - '.github/workflows/pretio-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test public catalog and responsive UI
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pretio-catalog-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --check pretio/catalog/catalog.js
          node --test tests/pretio-catalog-smoke.test.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pretio-public-catalog-screenshots
          path: artifacts/screenshots/pretio-catalog-*.png
          if-no-files-found: ignore
          retention-days: 7
