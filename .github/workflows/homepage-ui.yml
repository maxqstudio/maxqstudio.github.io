name: Homepage UI regression
on:
  push:
    branches: [main, fix/stable-theme-css-loading-20261109]
    paths:
      - 'index.html'
      - 'style.css'
      - 'style-dark.css'
      - 'script.js'
      - 'images/maxq-tools-logo.svg'
      - 'tests/homepage-smoke.test.mjs'
      - '.github/workflows/homepage-ui.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'style.css'
      - 'style-dark.css'
      - 'script.js'
      - 'images/maxq-tools-logo.svg'
      - 'tests/homepage-smoke.test.mjs'
      - '.github/workflows/homepage-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04 # Playwright 1.56.1 cannot install Chromium deps on ubuntu-latest (26.04)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/homepage-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --check script.js
          node --test tests/homepage-smoke.test.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-responsive-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7
